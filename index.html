<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Animal Evolution! 🐳</title>
    <style>
        :root {
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(45deg, #f39c12, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .scores {
            display: flex;
            gap: 8px;
        }

        .score-box {
            background: #202024;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #29292e;
        }

        .score-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #a8a8b3;
            font-weight: bold;
        }

        .score-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .board-container {
            position: relative;
            background: #202024;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.05);
            width: 100%;
            aspect-ratio: 1;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .grid-cell {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            width: 100%;
            height: 100%;
        }

        .tile {
            position: absolute;
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .tile-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            width: 100%;
            height: 100%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .tile-whale {
            animation: pulse-gold 1.5s infinite alternate;
        }

        @keyframes pulse-gold {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.05); filter: brightness(1.2); }
        }

        .pop {
            animation: popAnim 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }
        @keyframes popAnim {
            0% { transform: scale(0); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .merge-anim {
            animation: mergeAnim 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.8);
        }
        @keyframes mergeAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.25) rotate(3deg); filter: brightness(1.4); }
            100% { transform: scale(1); }
        }

        .shake {
            animation: shakeAnim 0.3s ease-in-out;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 4px); }
            40% { transform: translate(6px, -4px); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(4px, 2px); }
        }

        .floating-score {
            position: absolute;
            font-weight: 900;
            font-size: 1.2rem;
            color: #f1c40f;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 10;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            border-radius: 16px;
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
        }

        .btn-restart {
            margin-top: 15px;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .btn-restart:active {
            transform: scale(0.95);
            background: #219653;
        }

        #gameOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #gameOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #gameOverlay h2 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: #ff5252;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Animal Evolution 🐳</h1>
            <div class="scores">
                <div class="score-box">
                    <span class="score-label">Score</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">Best</span>
                    <span class="score-value" id="bestScore">0</span>
                </div>
            </div>
        </header>

        <div class="board-container" id="boardContainer">
            <canvas id="particleCanvas"></canvas>
            <div class="grid" id="grid">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div id="tileLayer" style="position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; pointer-events: none;"></div>

            <div id="gameOverlay">
                <h2>Fim de Jogo!</h2>
                <button class="btn-restart" onclick="game.restart()">Tentar de Novo</button>
            </div>
        </div>

        <div class="controls-hint">Deslize o dedo em qualquer direção na tela</div>
        <button class="btn-restart" style="background:#29292e; color:#ccc; width:100%;" onclick="game.restart()">Reiniciar Partida</button>
    </div>

    <script>
        const ANIMALS = {
            2:    { name: 'Pintinho', emoji: '🐥', bg: '#3b3b4f' },
            4:    { name: 'Galinha',  emoji: '🐔', bg: '#4f3b5f' },
            8:    { name: 'Gato',     emoji: '🐱', bg: '#d35400' },
            16:   { name: 'Cachorro', emoji: '🐶', bg: '#e67e22' },
            32:   { name: 'Porco',    emoji: '🐷', bg: '#e74c3c' },
            64:   { name: 'Ovelha',   emoji: '🐑', bg: '#c0392b' },
            128:  { name: 'Vaca',     emoji: '🐮', bg: '#f1c40f', shadow: 'rgba(241, 196, 15, 0.6)' },
            256:  { name: 'Cavalo',   emoji: '🐴', bg: '#f39c12', shadow: 'rgba(243, 156, 18, 0.8)' },
            512:  { name: 'Leão',     emoji: '🦁', bg: '#27ae60', shadow: 'rgba(39, 174, 96, 0.9)' },
            1024: { name: 'Elefante', emoji: '🐘', bg: '#2980b9', shadow: 'rgba(41, 128, 185, 1)' },
            2048: { name: 'Baleia',   emoji: '🐳', bg: '#8e44ad', shadow: 'rgba(142, 68, 173, 1)', special: true }
        };

        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') { this.ctx.resume(); }
            }
            playPop(pitch = 1) {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(150 * pitch, now);
                osc.frequency.exponentialRampToValueAtTime(600 * pitch, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }
            playMerge(level = 1) {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                const now = this.ctx.currentTime;
                const baseFreq = 220 * Math.pow(1.15, Math.min(level, 10));
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
            playGameOver() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [300, 240, 180, 120].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.15);
                });
            }
        }

        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.animate();
            }
            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }
            spawn(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 5;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: 3 + Math.random() * 4,
                        color,
                        alpha: 1,
                        decay: 0.02 + Math.random() * 0.03
                    });
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
                requestAnimationFrame(() => this.animate());
            }
        }

        class Game2048 {
            constructor() {
                this.board = Array(4).fill().map(() => Array(4).fill(0));
                this.score = 0;
                this.bestScore = localStorage.getItem('bestScore_animals') || 0;
                this.sound = new SoundFX();
                document.getElementById('bestScore').innerText = this.bestScore;
                
                this.tileLayer = document.getElementById('tileLayer');
                this.boardContainer = document.getElementById('boardContainer');
                this.particleSys = new ParticleSystem(document.getElementById('particleCanvas'));

                this.setupInputs();
                this.restart();
            }

            restart() {
                this.board = Array(4).fill().map(() => Array(4).fill(0));
                this.score = 0;
                this.updateScore(0);
                document.getElementById('gameOverlay').classList.remove('active');
                this.tileLayer.innerHTML = '';
                this.addRandomTile();
                this.addRandomTile();
                requestAnimationFrame(() => this.render());
            }

            updateScore(inc) {
                this.score += inc;
                document.getElementById('score').innerText = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('bestScore_animals', this.bestScore);
                    document.getElementById('bestScore').innerText = this.bestScore;
                }
            }

            addRandomTile() {
                let empty = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.board[r][c] === 0) empty.push({r, c});
                    }
                }
                if (empty.length > 0) {
                    let {r, c} = empty[Math.floor(Math.random() * empty.length)];
                    this.board[r][c] = Math.random() < 0.9 ? 2 : 4;
                    return {r, c};
                }
                return null;
            }

            setupInputs() {
                let touchStartX = 0, touchStartY = 0;
                window.addEventListener('touchstart', e => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    this.sound.init();
                }, {passive: true});

                window.addEventListener('touchend', e => {
                    if (!touchStartX || !touchStartY) return;
                    let dx = e.changedTouches[0].clientX - touchStartX;
                    let dy = e.changedTouches[0].clientY - touchStartY;
                    let absDx = Math.abs(dx), absDy = Math.abs(dy);

                    if (Math.max(absDx, absDy) > 25) {
                        if (absDx > absDy) {
                            this.move(dx > 0 ? 'right' : 'left');
                        } else {
                            this.move(dy > 0 ? 'down' : 'up');
                        }
                    }
                    touchStartX = 0; touchStartY = 0;
                }, {passive: true});
            }

            move(direction) {
                let moved = false, mergedPositions = [], gainedScore = 0;
                let rot = direction === 'right' ? 2 : direction === 'up' ? 3 : direction === 'down' ? 1 : 0;
                let grid = JSON.parse(JSON.stringify(this.board));

                for (let i = 0; i < rot; i++) grid = this.rotateMatrix(grid);

                let newGrid = [];
                for (let r = 0; r < 4; r++) {
                    let row = grid[r].filter(v => v !== 0);
                    let newRow = [], skip = false;
                    for (let c = 0; c < row.length; c++) {
                        if (skip) { skip = false; continue; }
                        if (c + 1 < row.length && row[c] === row[c+1]) {
                            let mergedVal = row[c] * 2;
                            newRow.push(mergedVal);
                            gainedScore += mergedVal;
                            skip = true;
                            mergedPositions.push({r, c: newRow.length - 1, val: mergedVal});
                        } else {
                            newRow.push(row[c]);
                        }
                    }
                    while (newRow.length < 4) newRow.push(0);
                    if (JSON.stringify(newRow) !== JSON.stringify(grid[r])) moved = true;
                    newGrid.push(newRow);
                }

                for (let i = 0; i < (4 - rot) % 4; i++) newGrid = this.rotateMatrix(newGrid);

                if (moved) {
                    this.board = newGrid;
                    if (gainedScore > 0) {
                        this.updateScore(gainedScore);
                        this.sound.playMerge(Math.log2(gainedScore));
                        if (gainedScore >= 64) {
                            this.boardContainer.classList.add('shake');
                            setTimeout(() => this.boardContainer.classList.remove('shake'), 300);
                        }
                    } else {
                        this.sound.playPop(0.8);
                    }

                    let newTile = this.addRandomTile();
                    this.render(newTile, mergedPositions);

                    if (this.isGameOver()) {
                        setTimeout(() => {
                            this.sound.playGameOver();
                            document.getElementById('gameOverlay').classList.add('active');
                        }, 400);
                    }
                }
            }

            rotateMatrix(mat) {
                let res = Array(4).fill().map(() => Array(4).fill(0));
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) res[c][3 - r] = mat[r][c];
                }
                return res;
            }

            isGameOver() {
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.board[r][c] === 0) return false;
                        if (c < 3 && this.board[r][c] === this.board[r][c+1]) return false;
                        if (r < 3 && this.board[r][c] === this.board[r+1][c]) return false;
                    }
                }
                return true;
            }

            render(newTile = null, merges = []) {
                this.tileLayer.innerHTML = '';
                const rect = this.tileLayer.getBoundingClientRect();
                const containerWidth = rect.width || this.tileLayer.clientWidth || 300;
                const cellSize = containerWidth / 4;

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        let val = this.board[r][c];
                        if (val === 0) continue;

                        let animal = ANIMALS[val] || ANIMALS[2048];
                        
                        // Wrapper externo responsável APENAS pela posição exata na grade
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        let x = c * cellSize, y = r * cellSize;
                        tile.style.width = `${cellSize - 8}px`;
                        tile.style.height = `${cellSize - 8}px`;
                        tile.style.transform = `translate(${x + 4}px, ${y + 4}px)`;

                        // Elemento interno responsável pelo visual e animações (pop/merge)
                        const inner = document.createElement('div');
                        inner.className = `tile-content ${val === 2048 ? 'tile-whale' : ''}`;
                        inner.style.backgroundColor = animal.bg;
                        if (animal.shadow) {
                            inner.style.boxShadow = `0 0 20px ${animal.shadow}`;
                        }

                        inner.innerHTML = `
                            <span style="font-size: 1.8rem; line-height: 1;">${animal.emoji}</span>
                            <span style="font-size: 0.58rem; margin-top: 3px; font-weight: bold; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 0.5px;">${animal.name}</span>
                        `;

                        let isMerged = merges.some(m => m.r === r && m.c === c);
                        if (isMerged) {
                            inner.classList.add('merge-anim');
                            let px = x + cellSize / 2, py = y + cellSize / 2;
                            let colors = ['#f1c40f', '#27ae60', '#e67e22', '#ffffff'];
                            this.particleSys.spawn(px, py, colors[Math.floor(Math.random() * colors.length)]);
                            this.spawnFloatingScore(px, py, `+${val}`);
                        } else if (newTile && newTile.r === r && newTile.c === c) {
                            inner.classList.add('pop');
                        }

                        tile.appendChild(inner);
                        this.tileLayer.appendChild(tile);
                    }
                }
            }

            spawnFloatingScore(x, y, text) {
                const el = document.createElement('div');
                el.className = 'floating-score';
                el.innerText = text;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                this.boardContainer.appendChild(el);
                setTimeout(() => el.remove(), 600);
            }
        }

        const game = new Game2048();
    </script>
</body>
</html>
